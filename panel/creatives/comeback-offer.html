<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nissan KSA demo | Comeback offer (Dengage panel content)</title>
<!-- =========================================================================
     Campaign: nissan_demo_comeback-offer. Paste this WHOLE FILE into
     Content > On-Site > Custom HTML.

     PANEL SETTINGS
       Trigger              Data Layer Event
       Event name           nissan_demo_comeback-offer
       Where to display     /nissanksa/
       Status               Active
       Show every X minutes 1
       Max show count       100
       Layout               Popup, width 460
       Design               padding 0, transparent background
       Close button         Layout > Close Button > Add close button to outside

     Padding 0 and the transparent background are not style choices: without
     them the engine draws its own white box around the card. Renders in the
     engine's cross origin iframe: no script tags (the panel strips them on
     save), links carry target=_top, imagery is absolute to the published
     origin. -->
</head>
<body>
<style>
  #nkx-cbk { font-family: 'Nissan Brand', Arial, sans-serif; color: #111; background: #fff; border-radius: 4px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.22); max-width: 460px; }
  #nkx-cbk .m { background: #f4f4f4; }
  #nkx-cbk .m img { display: block; width: 100%; height: auto; }
  #nkx-cbk .b { padding: 20px 22px; }
  #nkx-cbk .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #c3002f; font-weight: 700; }
  #nkx-cbk h2 { margin: 6px 0 8px; font-size: 20px; line-height: 1.25; color: #111; }
  #nkx-cbk p { margin: 0 0 14px; font-size: 13.5px; line-height: 1.55; color: #3a3f43; }
  #nkx-cbk .cta { display: inline-block; background: #111; color: #fff; text-decoration: none; font-size: 13px; letter-spacing: .06em; font-weight: 600; padding: 12px 24px; border-radius: 999px; }
  #nkx-cbk .later { display: inline-block; margin-inline-start: 12px; color: #6e7275; font-size: 12.5px; text-decoration: underline; cursor: pointer; background: none; border: 0; font-family: inherit; }
</style>
<div id="nkx-cbk">
  <div class="m">
    <img src="https://dengage-presales.github.io/nissanksa/assets/img/side-x-trail.jpg" alt="Nissan X-TRAIL">
  </div>
  <div class="b">
    <span class="k">Welcome back</span>
    <h2>The X-TRAIL you looked at is still here</h2>
    <p>Pick up where you left off, or let a test drive settle it. Either way, it takes a minute.</p>
    <a class="cta" target="_top" href="https://dengage-presales.github.io/nissanksa/vehicles/x-trail/index.html">CONTINUE EXPLORING</a>
    <button type="button" class="later" onclick="window.Dn&&Dn.sendClick&&Dn.sendClick('later'); Dn.closePopup && Dn.closePopup();">Maybe later</button>
  </div>
</div>
</body>
</html>
