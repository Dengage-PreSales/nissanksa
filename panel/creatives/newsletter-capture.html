<!-- nissan_demo_newsletter-capture | Content type: Popup (custom HTML).
     A capture form on the engine's native mechanism: data-dn-form-id inputs,
     Dn.postSubscription, data-dn-is-submitted success state. -->
<style>
  #nkx-nws { font-family: 'Nissan Brand', Arial, sans-serif; background: #fff; color: #111; border-radius: 4px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.22); max-width: 400px; }
  #nkx-nws .b { padding: 24px 22px; }
  #nkx-nws .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #c3002f; font-weight: 700; }
  #nkx-nws h2 { margin: 6px 0 8px; font-size: 19px; color: #111; }
  #nkx-nws p { margin: 0 0 12px; font-size: 13px; line-height: 1.55; color: #3a3f43; }
  #nkx-nws input { width: 100%; box-sizing: border-box; border: 1px solid #d9dde1; border-radius: 3px; padding: 11px 12px; font: inherit; font-size: 13.5px; margin-bottom: 10px; }
  #nkx-nws input[data-dn-invalid="true"] { border-color: #c3002f; }
  #nkx-nws .cta { width: 100%; border: 0; background: #111; color: #fff; font: inherit; font-size: 13px; letter-spacing: .06em; font-weight: 600; padding: 12px 16px; border-radius: 999px; cursor: pointer; }
  #nkx-nws .fine { font-size: 11px; color: #6e7275; margin-top: 8px; }
  #nkx-nws .done { display: none; padding: 8px 0 2px; color: #10633f; font-size: 13.5px; }
  #nkx-nws .container[data-dn-is-submitted="true"] .done { display: block; }
  #nkx-nws .container[data-dn-is-submitted="true"] .hide-after { display: none; }
</style>
<div id="nkx-nws">
  <div class="b container">
    <span class="k">Stay in the loop</span>
    <h2>New models, new offers, first</h2>
    <div class="hide-after">
      <p>One email when something worth knowing happens. No noise.</p>
      <input type="email" data-dn-form-id="email" placeholder="Email address" data-dn-validation="email" data-dn-required="true">
      <button type="button" class="cta" onclick="Dn.postSubscription(); Dn.sendClick('subscribe');">SIGN ME UP</button>
      <p class="fine">By subscribing you agree to receive updates from this demo. Unsubscribe any time.</p>
    </div>
    <p class="done">Welcome aboard. You are on the list.</p>
  </div>
</div>
