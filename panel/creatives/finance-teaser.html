<!-- =========================================================================
     Campaign: nissan_demo_finance-teaser. Paste this WHOLE FILE into
     Content > On-Site > Custom HTML.

     PANEL SETTINGS
       Trigger              Data Layer Event
       Event name           nissan_demo_finance-teaser
       Where to display     /nissanksa/
       Status               Active

       Layout               Sticky bar, bottom

  #nkx-fin .x { background: none; border: 0; color: #9aa0a6; font-size: 16px; cursor: pointer; padding: 4px 6px; }
</style>
<div id="nkx-fin">
  <span class="k">Finance offer</span>
  <span class="t">X-TRAIL monthly installments from <b>SAR 999</b>, 0% admin fees, 0% down payment</span>
