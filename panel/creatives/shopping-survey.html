<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Nissan KSA demo | Shopping survey (Dengage panel content)</title>
<!-- =========================================================================
     Campaign: nissan_demo_shopping-survey. Paste this WHOLE FILE into
     Content > On-Site > Custom HTML.

     PANEL SETTINGS
       Trigger              SCROLL DEPTH, chosen 29 August. The launcher card
                            shows the gesture; this campaign does not listen for
                            a data layer event
       Event name           nissan_demo_shopping-survey
       Where to display     /nissanksa/
       Status               Active
       Show every X minutes 1
       Max show count       100
       Layout               Popup, width 440
       Design               padding 0, transparent background
       Close button         Layout > Close Button > Add close button to outside

     THE NATIVE QUESTION CONTRACT. The engine injects its question handler only
     when the stored content contains the exact text data-dn-form-id="question_form",
     so the form below is the root element and carries it. The first .form-block
     carries data-dn-name, which becomes the contact tag the answer is written
     to, plus the selection bounds. Dn.postQuestion() validates, writes its own
     message into div.form-message, and stores the answer as a tag the panel
     can segment on. No script tags: the panel strips them on save. -->
</head>
<body>
<form class="form" data-dn-form-id="question_form" data-dn-validation-language="en"
      id="nkx-svy" onsubmit="return false">
  <style>
    #nkx-svy * { margin: 0; padding: 0; box-sizing: border-box; }
    #nkx-svy { font-family: 'Nissan Brand', Arial, sans-serif; width: 100%; display: block; color: #111; }
    body > #nkx-svy { max-width: 440px; margin: 40px auto; }
    #nkx-svy .container { width: 100%; background: #fff; border-radius: 6px; overflow: hidden; box-shadow: 0 16px 40px rgba(0,0,0,.22); }
    #nkx-svy .b { padding: 24px 22px; }
    #nkx-svy .k { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: #c3002f; font-weight: 700; }
    #nkx-svy h2 { margin: 6px 0 12px; font-size: 19px; line-height: 1.3; color: #111; }
    #nkx-svy label.opt { display: flex; gap: 10px; align-items: center; font-size: 13.5px; padding: 10px 12px; border: 1px solid #e3e3e3; border-radius: 4px; margin-bottom: 8px; cursor: pointer; }
    #nkx-svy label.opt:hover { border-color: #111; }
    #nkx-svy .opt input { accent-color: #c3002f; width: 15px; height: 15px; flex-shrink: 0; }
    #nkx-svy .form-message { display: none; font-size: 12px; color: #c3002f; margin: 2px 0 6px; }
    #nkx-svy [data-dn-invalid="true"] .form-message,
    #nkx-svy [data-dn-invalid="true"] ~ .form-message { display: block !important; }
    #nkx-svy .send { display: block; width: 100%; border: 0; cursor: pointer; margin-top: 8px; background: #111; color: #fff; border-radius: 999px; padding: 12px 16px; font-family: inherit; font-size: 13px; letter-spacing: .06em; font-weight: 600; }
    #nkx-svy .send:hover { background: #c3002f; }
    #nkx-svy .fine { font-size: 11px; color: #6e7275; margin-top: 10px; margin-bottom: 0; }
    #nkx-svy .submitted-content { display: none; padding: 30px 24px 34px; text-align: center; }
    #nkx-svy .submitted-content .tick { width: 42px; height: 42px; margin: 0 auto 12px; border-radius: 50%; background: #e7f6ee; color: #10633f; font-size: 22px; line-height: 42px; }
    #nkx-svy .submitted-content p { font-size: 13px; color: #3a3f43; margin-top: 6px; }
    #nkx-svy .container[data-dn-is-submitted="true"] .b { display: none; }
    #nkx-svy .container[data-dn-is-submitted="true"] .submitted-content { display: block !important; }
  </style>

  <div class="container" style="width:100%;background:#ffffff;border-radius:6px;overflow:hidden;font-family:Arial,sans-serif;color:#111111">
    <div class="b" style="padding:24px 22px">
      <span class="k">30 seconds, one question</span>
      <h2>What would help you decide today?</h2>

      <!-- data-dn-is-radio is load bearing: without it the engine validates in
           checkbox mode, counts zero checked checkboxes among these radios,
           and refuses every answer. Read from the engine's own form handler. -->
      <div class="form-block" data-dn-name="pre_purchase_blocker" data-dn-is-radio="true"
           data-dn-min-selection="1" data-dn-max-selection="1">
        <label class="opt"><input type="radio" name="nkx-decide" value="price"> Clear pricing and offers</label>
        <label class="opt"><input type="radio" name="nkx-decide" value="test-drive"> A test drive</label>
        <label class="opt"><input type="radio" name="nkx-decide" value="finance"> Finance options</label>
        <label class="opt"><input type="radio" name="nkx-decide" value="compare"> Comparing models side by side</label>
        <div class="form-message" style="display:none">Pick one to send.</div>
      </div>

      <button style="display:block;width:100%;border:0;cursor:pointer;margin-top:8px;background:#111111;color:#ffffff;border-radius:999px;padding:12px 16px;font-size:13px;font-weight:600;letter-spacing:.06em" type="button" class="send"
              onclick="var self=this,f=document.getElementById('nkx-svy'),b=f.querySelector('.form-block'),n=(typeof Dn!=='undefined'&&typeof Dn.postQuestion==='function');var done=function(){if(b.getAttribute('data-dn-invalid')==='true'){return;}self.disabled=true;if(typeof Dn!=='undefined'&&Dn.sendClick){Dn.sendClick('shopping-survey__answer');}f.querySelector('.container').setAttribute('data-dn-is-submitted','true');};if(n){b.removeAttribute('data-dn-invalid');Dn.postQuestion();window.setTimeout(done,300);}else{var s=b.querySelectorAll('input:checked'),t=b.getAttribute('data-dn-name'),v=[],i=0;for(i=0;i<s.length;i++){v.push({tag:t,value:s[i].value});}if(!v.length){b.setAttribute('data-dn-invalid','true');return;}b.removeAttribute('data-dn-invalid');if(typeof Dn!=='undefined'&&Dn.setTags){Dn.setTags(v);}done();}">
        SEND
      </button>
      <p class="fine">A demonstration storefront. Your answer becomes a tag on your contact, which the panel can segment on.</p>
    </div>

    <div class="submitted-content" style="display:none" data-dn-is-enabled="true"
         data-dn-is-modal-auto-close-enabled="true" data-dn-modal-close-seconds="6">
      <div class="tick">&#10003;</div>
      <h2>Thank you</h2>
      <p>That is on your contact record now, as a tag a segment can use.</p>
    </div>
  </div>
</form>
</body>
</html>
